<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Gato triste con detalles -->
  
  <!-- Oreja izquierda (caída) -->
  <path d="M28 30 L15 15 L32 25 Z"
        fill="white" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
  <path d="M29 27 L20 18 L30 24 Z"
        fill="#1a1a1a" opacity="0.2"/>
  
  <!-- Oreja derecha (caída) -->
  <path d="M72 30 L85 15 L68 25 Z"
        fill="white" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
  <path d="M71 27 L80 18 L70 24 Z"
        fill="#1a1a1a" opacity="0.2"/>
  
  <!-- Cabeza -->
  <circle cx="50" cy="52" r="30" fill="white" stroke="#1a1a1a" stroke-width="5"/>
  
  <!-- Ojos tristes -->
  <circle cx="38" cy="48" r="4" fill="#1a1a1a"/>
  <circle cx="62" cy="48" r="4" fill="#1a1a1a"/>
  
  <!-- Lágrimas -->
  <path d="M38 54 Q36 60 38 64"
        fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="38" cy="65" r="2.5" fill="#1a1a1a" opacity="0.5"/>
  
  <!-- Nariz -->
  <path d="M48 58 L50 61 L52 58 Z"
        fill="#1a1a1a"/>
  
  <!-- Boca triste -->
  <path d="M50 61 L50 63"
        stroke="#1a1a1a" stroke-width="2.5"/>
  <path d="M42 68 Q50 62 58 68"
        fill="none" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Bigotes caídos izquierda -->
  <line x1="22" y1="52" x2="32" y2="50" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="58" x2="32" y2="57" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="64" x2="32" y2="64" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Bigotes caídos derecha -->
  <line x1="78" y1="52" x2="68" y2="50" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="78" y1="58" x2="68" y2="57" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="78" y1="64" x2="68" y2="64" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
</svg>
