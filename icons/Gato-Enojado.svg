<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Gato enojado con detalles -->
  
  <!-- Oreja izquierda (hacia atrás por enojo) -->
  <path d="M30 32 L12 20 L28 28 Z"
        fill="white" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
  <path d="M29 30 L18 24 L27 28 Z"
        fill="#1a1a1a" opacity="0.2"/>
  
  <!-- Oreja derecha (hacia atrás) -->
  <path d="M70 32 L88 20 L72 28 Z"
        fill="white" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
  <path d="M71 30 L82 24 L73 28 Z"
        fill="#1a1a1a" opacity="0.2"/>
  
  <!-- Cabeza -->
  <circle cx="50" cy="52" r="30" fill="white" stroke="#1a1a1a" stroke-width="5"/>
  
  <!-- Cejas enojadas -->
  <path d="M32 40 L42 44"
        stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <path d="M68 40 L58 44"
        stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Ojos enojados (entrecerrados) -->
  <ellipse cx="38" cy="48" rx="5" ry="3" fill="#1a1a1a"/>
  <ellipse cx="62" cy="48" rx="5" ry="3" fill="#1a1a1a"/>
  
  <!-- Nariz -->
  <path d="M48 58 L50 61 L52 58 Z"
        fill="#1a1a1a"/>
  
  <!-- Boca enojada (gruñendo) -->
  <path d="M50 61 L50 63"
        stroke="#1a1a1a" stroke-width="2.5"/>
  <path d="M40 66 Q50 62 60 66"
        fill="none" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Dientes (gruñido) -->
  <line x1="44" y1="65" x2="44" y2="68" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="50" y1="64" x2="50" y2="67" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="56" y1="65" x2="56" y2="68" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Bigotes tensos (hacia atrás) -->
  <line x1="22" y1="50" x2="32" y2="52" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="22" y1="56" x2="32" y2="57" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="22" y1="62" x2="32" y2="62" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  
  <line x1="78" y1="50" x2="68" y2="52" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="78" y1="56" x2="68" y2="57" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="78" y1="62" x2="68" y2="62" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Arrugas de enojo en la frente -->
  <path d="M42 36 Q44 34 46 36"
        fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M54 36 Q56 34 58 36"
        fill="none" stroke="#1a1a1a" stroke-width="2"/>
</svg>
