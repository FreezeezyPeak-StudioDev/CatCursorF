<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Gato sorprendido con detalles -->
  
  <!-- Oreja izquierda (levantada) -->
  <path d="M22 28 L18 8 L32 22 Z"
        fill="white" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
  <path d="M24 24 L21 12 L30 20 Z"
        fill="#1a1a1a" opacity="0.2"/>
  
  <!-- Oreja derecha (levantada) -->
  <path d="M78 28 L82 8 L68 22 Z"
        fill="white" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
  <path d="M76 24 L79 12 L70 20 Z"
        fill="#1a1a1a" opacity="0.2"/>
  
  <!-- Cabeza -->
  <circle cx="50" cy="50" r="30" fill="white" stroke="#1a1a1a" stroke-width="5"/>
  
  <!-- Ojos muy abiertos (sorpresa) -->
  <circle cx="38" cy="45" r="7" fill="white" stroke="#1a1a1a" stroke-width="4"/>
  <circle cx="38" cy="45" r="4" fill="#1a1a1a"/>
  <circle cx="40" cy="43" r="1.5" fill="white"/>
  
  <circle cx="62" cy="45" r="7" fill="white" stroke="#1a1a1a" stroke-width="4"/>
  <circle cx="62" cy="45" r="4" fill="#1a1a1a"/>
  <circle cx="64" cy="43" r="1.5" fill="white"/>
  
  <!-- Cejas levantadas -->
  <path d="M30 35 Q35 32 40 35"
        fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <path d="M60 35 Q65 32 70 35"
        fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Nariz -->
  <path d="M48 56 L50 59 L52 56 Z"
        fill="#1a1a1a"/>
  
  <!-- Boca abierta (sorpresa) -->
  <path d="M50 59 L50 61"
        stroke="#1a1a1a" stroke-width="2.5"/>
  <ellipse cx="50" cy="67" rx="6" ry="8"
           fill="white" stroke="#1a1a1a" stroke-width="3.5"/>
  
  <!-- Bigotes rectos (tensos) -->
  <line x1="20" y1="48" x2="32" y2="48" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="54" x2="32" y2="54" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="60" x2="32" y2="60" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  
  <line x1="80" y1="48" x2="68" y2="48" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="54" x2="68" y2="54" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="60" x2="68" y2="60" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
</svg>
