<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Cabeza mejorada (negro noche) -->
  <circle cx="48" cy="52" r="30" fill="#222222" stroke="#ffd94d" stroke-width="3.5"/>
  
  <!-- Orejas mejoradas -->
  <polygon points="26,38 20,14 40,28" fill="#222222" stroke="#ffd94d" stroke-width="3.5" stroke-linejoin="round"/>
  <polygon points="70,38 76,14 56,28" fill="#222222" stroke="#ffd94d" stroke-width="3.5" stroke-linejoin="round"/>
  
  <!-- Interior orejas (dorado) -->
  <polygon points="27,33 23,19 37,28" fill="#ffd94d"/>
  <polygon points="69,33 73,19 59,28" fill="#ffd94d"/>
  
  <!-- Ojos mejorados (dorados brillantes) -->
  <ellipse cx="38" cy="50" rx="5" ry="6.5" fill="#ffd94d"/>
  <ellipse cx="58" cy="50" rx="5" ry="6.5" fill="#ffd94d"/>
  <ellipse cx="38" cy="51" rx="2" ry="3.8" fill="#111111"/>
  <ellipse cx="58" cy="51" rx="2" ry="3.8" fill="#111111"/>
  <!-- Brillo dorado -->
  <ellipse cx="39" cy="49" rx="1" ry="1.5" fill="#ffff99" opacity="0.9"/>
  <ellipse cx="59" cy="49" rx="1" ry="1.5" fill="#ffff99" opacity="0.9"/>
  
  <!-- Nariz -->
  <path d="M46 58 L48 61 L50 58 Z" fill="#ffd94d"/>
  <circle cx="48" cy="59" r="1.2" fill="#111111" opacity="0.3"/>
  
  <!-- Boca sonriente -->
  <path d="M44 62 Q48 66 52 62" stroke="#ffd94d" stroke-width="3" fill="none" stroke-linecap="round"/>
  <line x1="48" y1="61" x2="48" y2="62" stroke="#ffd94d" stroke-width="2"/>
  
  <!-- Bigotes mejorados (dorados) -->
  <g stroke="#ffd94d" stroke-width="2" stroke-linecap="round" opacity="0.9">
    <line x1="12" y1="52" x2="28" y2="54"/>
    <line x1="12" y1="58" x2="28" y2="58"/>
    <line x1="12" y1="64" x2="28" y2="62"/>
    <line x1="84" y1="52" x2="68" y2="54"/>
    <line x1="84" y1="58" x2="68" y2="58"/>
    <line x1="84" y1="64" x2="68" y2="62"/>
  </g>
  
  <!-- Luna y estrellas (tema nocturno) -->
  <circle cx="70" cy="30" r="5" fill="#ffd94d" opacity="0.7"/>
  <circle cx="73" cy="28" r="2" fill="#222222" opacity="0.5"/>
  
  <!-- Estrellas pequeñas -->
  <circle cx="28" cy="25" r="1.5" fill="#ffd94d" opacity="0.8"/>
  <circle cx="65" cy="20" r="1.2" fill="#ffd94d" opacity="0.8"/>
  <circle cx="32" cy="70" r="1.2" fill="#ffd94d" opacity="0.6"/>
  
  <!-- Mejillas brillantes -->
  <ellipse cx="32" cy="60" rx="4" ry="3" fill="#ffd94d" opacity="0.2"/>
  <ellipse cx="64" cy="60" rx="4" ry="3" fill="#ffd94d" opacity="0.2"/>
</svg>
