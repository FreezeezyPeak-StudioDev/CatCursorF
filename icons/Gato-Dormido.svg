<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Gato dormido con detalles -->
  
  <!-- Oreja izquierda (relajada) -->
  <path d="M26 28 L20 10 L34 24 Z"
