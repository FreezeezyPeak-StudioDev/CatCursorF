  <!-- Bigotes relajados -->
  <line x1="22" y1="52" x2="32" y2="50" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="57" x2="32" y2="56" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="62" x2="32" y2="62" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  
  <line x1="78" y1="52" x2="68" y2="50" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="78" y1="57" x2="68" y2="56" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="78" y1="62" x2="68" y2="62" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Zzz (durmiendo) -->
  <text x="72" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a">Z</text>
  <text x="78" y="22" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a" opacity="0.7">z</text>
  <text x="82" y="18" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1a1a1a" opacity="0.5">z</text>
