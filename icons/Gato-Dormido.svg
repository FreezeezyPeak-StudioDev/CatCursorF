  <!-- Cabeza -->
  <circle cx="50" cy="52" r="30" fill="white" stroke="#1a1a1a" stroke-width="5"/>
  
  <!-- Ojos cerrados (durmiendo) -->
  <path d="M32 46 Q38 48 44 46"
