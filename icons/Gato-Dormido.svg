  <!-- Pestañas -->
  <line x1="32" y1="46" x2="30" y2="42" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="48" x2="38" y2="44" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="44" y1="46" x2="46" y2="42" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  
  <line x1="56" y1="46" x2="54" y2="42" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="62" y1="48" x2="62" y2="44" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="46" x2="70" y2="42" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Nariz -->
  <path d="M48 58 L50 61 L52 58 Z"
