<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Cabeza mejorada (rojo navideño) -->
  <circle cx="48" cy="52" r="30" fill="#c01010" stroke="#ffffff" stroke-width="3.5"/>
  
  <!-- Orejas mejoradas -->
  <polygon points="26,38 20,14 40,28" fill="#c01010" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>
  <polygon points="70,38 76,14 56,28" fill="#c01010" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>
  
  <!-- Interior orejas navideño (verde) -->
  <polygon points="27,33 23,19 37,28" fill="#0a7d3a"/>
  <polygon points="69,33 73,19 59,28" fill="#0a7d3a"/>
  
  <!-- Ojos mejorados -->
  <ellipse cx="38" cy="50" rx="5" ry="6.5" fill="#ffffff"/>
  <ellipse cx="58" cy="50" rx="5" ry="6.5" fill="#ffffff"/>
  <ellipse cx="38" cy="51" rx="2" ry="3.8" fill="#1a1a1a"/>
  <ellipse cx="58" cy="51" rx="2" ry="3.8" fill="#1a1a1a"/>
  <!-- Brillo -->
  <ellipse cx="39" cy="49" rx="1" ry="1.5" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="59" cy="49" rx="1" ry="1.5" fill="#ffffff" opacity="0.9"/>
  
  <!-- Nariz -->
  <path d="M46 58 L48 61 L50 58 Z" fill="#ffd94d"/>
  <circle cx="48" cy="59" r="1.2" fill="#1a1a1a" opacity="0.3"/>
  
  <!-- Boca sonriente -->
  <path d="M44 62 Q48 66 52 62" stroke="#ffd94d" stroke-width="3" fill="none" stroke-linecap="round"/>
  <line x1="48" y1="61" x2="48" y2="62" stroke="#ffd94d" stroke-width="2"/>
  
  <!-- Bigotes mejorados -->
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9">
    <line x1="12" y1="52" x2="28" y2="54"/>
    <line x1="12" y1="58" x2="28" y2="58"/>
    <line x1="12" y1="64" x2="28" y2="62"/>
    <line x1="84" y1="52" x2="68" y2="54"/>
    <line x1="84" y1="58" x2="68" y2="58"/>
    <line x1="84" y1="64" x2="68" y2="62"/>
  </g>
  
  <!-- Detalles navideños: gorrito de Santa -->
  <path d="M40 20 L48 8 L56 20 Z" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
  <ellipse cx="48" cy="8" rx="4" ry="4" fill="#ffffff"/>
  
  <!-- Mejillas sonrojadas -->
  <ellipse cx="32" cy="60" rx="4" ry="3" fill="#ffffff" opacity="0.3"/>
  <ellipse cx="64" cy="60" rx="4" ry="3" fill="#ffffff" opacity="0.3"/>
  
  <!-- Patrón navideño (estrellas pequeñas) -->
  <circle cx="28" cy="45" r="2" fill="#0a7d3a" opacity="0.4"/>
  <circle cx="68" cy="45" r="2" fill="#0a7d3a" opacity="0.4"/>
</svg>
