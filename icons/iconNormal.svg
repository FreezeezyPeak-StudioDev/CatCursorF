<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Cabeza mejorada -->
  <circle cx="48" cy="52" r="30" fill="#3b3b3b" stroke="#ffffff" stroke-width="3.5"/>
  
  <!-- Orejas mejoradas -->
  <polygon points="26,38 20,14 40,28" fill="#3b3b3b" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>
  <polygon points="70,38 76,14 56,28" fill="#3b3b3b" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>
  
  <!-- Interior orejas más visible -->
  <polygon points="27,33 23,19 37,28" fill="#ff9db0"/>
  <polygon points="69,33 73,19 59,28" fill="#ff9db0"/>
  
  <!-- Ojos mejorados con brillo -->
  <ellipse cx="38" cy="50" rx="5" ry="6.5" fill="#ffd94d"/>
  <ellipse cx="58" cy="50" rx="5" ry="6.5" fill="#ffd94d"/>
  <ellipse cx="38" cy="51" rx="2" ry="3.8" fill="#1a1a1a"/>
  <ellipse cx="58" cy="51" rx="2" ry="3.8" fill="#1a1a1a"/>
  <!-- Brillo en los ojos -->
  <ellipse cx="39" cy="49" rx="1" ry="1.5" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="59" cy="49" rx="1" ry="1.5" fill="#ffffff" opacity="0.8"/>
  
  <!-- Nariz mejorada -->
  <path d="M46 58 L48 61 L50 58 Z" fill="#ff9db0"/>
  <circle cx="48" cy="59" r="1.2" fill="#1a1a1a" opacity="0.3"/>
  
  <!-- Boca sonriente -->
  <path d="M44 62 Q48 66 52 62" stroke="#ff9db0" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Línea de nariz a boca -->
  <line x1="48" y1="61" x2="48" y2="62" stroke="#ff9db0" stroke-width="2"/>
  
  <!-- Bigotes mejorados (3 por lado) -->
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9">
    <line x1="12" y1="52" x2="28" y2="54"/>
    <line x1="12" y1="58" x2="28" y2="58"/>
    <line x1="12" y1="64" x2="28" y2="62"/>
    <line x1="84" y1="52" x2="68" y2="54"/>
    <line x1="84" y1="58" x2="68" y2="58"/>
    <line x1="84" y1="64" x2="68" y2="62"/>
  </g>
  
  <!-- Manchas decorativas -->
  <circle cx="34" cy="42" r="3" fill="#2a2a2a" opacity="0.4"/>
  <circle cx="62" cy="42" r="3" fill="#2a2a2a" opacity="0.4"/>
  
  <!-- Mejillas sonrojadas -->
  <ellipse cx="32" cy="60" rx="4" ry="3" fill="#ff9db0" opacity="0.3"/>
  <ellipse cx="64" cy="60" rx="4" ry="3" fill="#ff9db0" opacity="0.3"/>
</svg>
